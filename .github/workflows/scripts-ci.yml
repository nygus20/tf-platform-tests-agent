# Unit tests for the workflow scripts and the report contract. terraform-tests.yml
# always runs scripts from the base commit, so changes to them are tested here first.
name: scripts-ci

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/schemas/**"
      - ".claude/**"
      - ".github/workflows/scripts-ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/schemas/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: scripts-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r .github/scripts/requirements.txt
          python -m pip install --require-hashes --no-deps -r .github/scripts/requirements-dev.txt

      - name: Run the unit tests
        run: python -m pytest .github/scripts/tests -q
