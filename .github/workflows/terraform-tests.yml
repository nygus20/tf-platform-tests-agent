# Terraform tests for pull requests, with a Claude Code agent that writes them.
#
# Trust boundaries (see SOLUTION.md):
#   detect   no secrets, read-only          maps changed files to modules
#   agent    ANTHROPIC_API_KEY, read-only   runs Claude Code only; never terraform or repository scripts
#   guard    no secrets, read-only          rejects any agent output outside modules/*/tests/*.tftest.hcl
#   test     no secrets, read-only          runs terraform test; its result is the verdict
#   publish  GITHUB_TOKEN with write        commits accepted tests, posts comments and a check run
#
# Scripts and agent configuration always come from the base commit, never from the PR.
name: terraform-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "modules/**"
      - "stacks/**"
      - ".claude/**"
      - ".github/workflows/terraform-tests.yml"
      - ".github/scripts/**"
      - ".github/schemas/**"
      - ".github/agent-runtime/**"

permissions: {}

concurrency:
  # Label events other than the backfill label do nothing, so they get their own
  # group and never cancel a real run.
  group: >-
    terraform-tests-${{ github.event.pull_request.number }}${{
    (github.event.action == 'labeled' && github.event.label.name != 'tf-agent:backfill')
    && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TF_IN_AUTOMATION: "1"
  CHECKPOINT_DISABLE: "1"

jobs:
  detect:
    name: detect changes
    if: github.event.action != 'labeled' || github.event.label.name == 'tf-agent:backfill'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      agent_eligible: ${{ steps.detect.outputs.agent_eligible }}
      agent_skip_reason: ${{ steps.detect.outputs.agent_skip_reason }}
      same_repo: ${{ steps.detect.outputs.same_repo }}
    steps:
      - name: Check out scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/files" > "$RUNNER_TEMP/files.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '{message: .commit.message}' > "$RUNNER_TEMP/head-commit.json"

      - name: Map files to modules and stacks
        id: detect
        run: >-
          python trusted/.github/scripts/detect_changes.py
          --files "$RUNNER_TEMP/files.json"
          --event "$GITHUB_EVENT_PATH"
          --head-commit "$RUNNER_TEMP/head-commit.json"
          --root head
          --out-dir "$RUNNER_TEMP/changes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes/
          retention-days: 7

  agent:
    name: agent writes tests
    needs: detect
    if: needs.detect.outputs.agent_eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Check out agent configuration from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: |
            .claude
            .github
          persist-credentials: false

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned Claude Code CLI without running package scripts
        working-directory: trusted/.github/agent-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bin="$PWD/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          "$bin" --version
          echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build the agent's work directory
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          mkdir -p "$work"
          cp -R head/modules head/stacks "$work/"
          cp head/README.md "$work/" 2>/dev/null || true
          # Nothing from the PR may configure or instruct Claude Code.
          find "$work" \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .mcp.json \) -type f -delete
          find "$work" -name .claude -type d -prune -exec rm -rf {} +
          find "$work" -type l -delete
          mkdir -p "$work/.claude" "$work/.agent"
          cp -R trusted/.claude/agents trusted/.claude/skills "$work/.claude/"
          cp trusted/.github/schemas/report.schema.json "$work/.claude/skills/tf-agent-report/"
          cp "$RUNNER_TEMP/changes/changes.json" "$RUNNER_TEMP/changes/changes.patch" "$work/.agent/"
          git -C "$work" init -q
          git -C "$work" add -A
          git -C "$work" -c user.name=agent -c user.email=agent@localhost commit -qm baseline
          echo "WORK=$work" >> "$GITHUB_ENV"

      - name: Report a missing API key
        if: env.HAS_KEY != 'true'
        run: echo "::error::The ANTHROPIC_API_KEY secret is not set, so the agent cannot run."

      - name: Run the agent
        id: claude
        if: env.HAS_KEY == 'true'
        working-directory: ${{ runner.temp }}/work
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1"
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "1"
          SETTINGS: ${{ github.workspace }}/trusted/.claude/settings.ci.json
          MCP_CONFIG: ${{ github.workspace }}/trusted/.claude/mcp-empty.json
        run: |
          set +e
          "$CLAUDE_BIN" -p "Run the Terraform test procedure for the modules in .agent/changes.json." \
            --agent tf-test-agent \
            --setting-sources project \
            --settings "$SETTINGS" \
            --permission-mode dontAsk \
            --tools "Read,Glob,Grep,Write,Edit,Agent,Skill" \
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,mcp__*" \
            --strict-mcp-config --mcp-config "$MCP_CONFIG" \
            --max-turns 60 \
            --max-budget-usd 3 \
            --output-format stream-json --verbose \
            < /dev/null > "$RUNNER_TEMP/transcript.jsonl"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          jq -r 'select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")
                 | "tool: \(.name) \(.input.skill // .input.subagent_type // .input.file_path // .input.pattern // "")"' \
            "$RUNNER_TEMP/transcript.jsonl" || true
          exit 0

      - name: Collect the agent's changes
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agent-output"
          mkdir -p "$out/files"
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            cd "$WORK"
            git add -A
            git diff --cached --name-status --no-renames -- . ':(exclude).agent/report.json' > "$out/changes.tsv"
            git diff --cached --name-only --no-renames --diff-filter=AM -z -- . ':(exclude).agent/report.json' |
              while IFS= read -r -d '' f; do
                mkdir -p "$out/files/$(dirname "$f")"
                cp -P "$f" "$out/files/$f"
              done
            if [ -f .agent/report.json ]; then cp .agent/report.json "$out/report.json"; fi
          fi
          if [ -f "$RUNNER_TEMP/transcript.jsonl" ]; then
            cp "$RUNNER_TEMP/transcript.jsonl" "$out/"
            jq -c 'select(.type == "result")' "$out/transcript.jsonl" | tail -n 1 > "$out/result.json" || true
          fi
          cat "$out/changes.tsv" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-output/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail when the agent did not finish
        if: env.HAS_KEY != 'true' || steps.claude.outputs.exit_code != '0'
        env:
          CODE: ${{ steps.claude.outputs.exit_code }}
        run: |
          echo "::error::The agent did not finish (exit code ${CODE:-none}). Existing tests still run."
          exit 1

  guard:
    name: guard agent output
    needs: [detect, agent]
    if: always() && needs.agent.result != 'skipped' && needs.agent.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - name: Check out scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r trusted/.github/scripts/requirements.txt

      - name: Check every file and the report
        id: guard
        run: >-
          python trusted/.github/scripts/guard.py
          --changes "$RUNNER_TEMP/changes/changes.json"
          --agent-dir "$RUNNER_TEMP/agent-output"
          --head head
          --schema trusted/.github/schemas/report.schema.json
          --out-dir "$RUNNER_TEMP/guard"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guard
          path: ${{ runner.temp }}/guard/
          retention-days: 7
          if-no-files-found: warn

  test:
    name: terraform test
    needs: [detect, guard]
    if: >-
      always() && needs.detect.result == 'success'
      && needs.detect.outputs.has_changes == 'true'
      && needs.guard.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes

      - name: Download the guard's output
        if: needs.guard.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guard
          path: ${{ runner.temp }}/guard

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run terraform test (this step is the verdict)
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          GUARD_OK: ${{ needs.guard.outputs.ok }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          overlay=()
          if [ "$GUARD_OK" = "true" ] && [ -d "$RUNNER_TEMP/guard/accepted" ]; then
            overlay=(--overlay "$RUNNER_TEMP/guard/accepted")
          fi
          python trusted/.github/scripts/run_tests.py \
            --root head \
            --changes "$RUNNER_TEMP/changes/changes.json" \
            "${overlay[@]}" \
            --out "$RUNNER_TEMP/results/results.json" \
            --junit-dir "$RUNNER_TEMP/results/junit" \
            --formatted-dir "$RUNNER_TEMP/results/formatted"

      - name: Write the job summary
        if: always()
        env:
          SKIP_REASON: ${{ needs.detect.outputs.agent_skip_reason }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python trusted/.github/scripts/render_summary.py
          --results "$RUNNER_TEMP/results/results.json"
          --guard "$RUNNER_TEMP/guard/guard.json"
          --report "$RUNNER_TEMP/guard/report.json"
          --sha "$HEAD_SHA"
          --skip-reason "$SKIP_REASON"
          --out "$RUNNER_TEMP/results/summary.md"
          --step-summary

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results
          path: ${{ runner.temp }}/results/
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: publish to the pull request
    needs: [detect, agent, guard, test]
    if: >-
      always() && needs.detect.outputs.same_repo == 'true'
      && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Check out the tested commit for pushing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: branch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: ${{ runner.temp }}/results

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.guard.result != 'skipped'
        continue-on-error: true
        with:
          name: guard
          path: ${{ runner.temp }}/guard

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Commit the accepted test files to the pull request branch
        id: commit
        if: needs.guard.outputs.ok == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/results/formatted"
          if [ ! -d "$src/modules" ]; then echo "No test files to commit."; exit 0; fi
          cd branch
          cp -R "$src/modules/." modules/
          git add -- ':(glob)modules/*/tests/*.tftest.hcl'
          if git diff --cached --quiet; then echo "Test files already up to date."; exit 0; fi
          if git diff --cached --name-only | grep -vE '^modules/[a-z0-9][a-z0-9-]*/tests/[A-Za-z0-9][A-Za-z0-9_-]*\.tftest\.hcl$'; then
            echo "::error::Refusing to commit files outside modules/*/tests/"; exit 1
          fi
          modules=$(git diff --cached --name-only | cut -d/ -f2 | sort -u | paste -sd, -)
          git -c user.name='github-actions[bot]' \
              -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
              commit -q -F - <<EOF
          test(${modules}): add or update terraform tests

          Written by the Terraform test agent, accepted by the guard and
          run by terraform test in workflow run ${RUN_ID}.

          Tf-Test-Agent: run ${RUN_ID}
          EOF
          if ! git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::error::The branch moved while the workflow ran. The newer run will redo this work."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post findings as review comments
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.commit.outputs.sha || github.event.pull_request.head.sha }}
        run: |
          if [ -f "$RUNNER_TEMP/guard/report.json" ]; then
            python trusted/.github/scripts/publish.py review --pr "$PR" \
              --report "$RUNNER_TEMP/guard/report.json" --patch "$RUNNER_TEMP/changes/changes.patch" \
              --commit "$SHA" --out "$RUNNER_TEMP/review.json"
          else
            echo "No agent report, so no findings to post."
          fi

      - name: Render and post the summary comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          SKIP_REASON: ${{ needs.detect.outputs.agent_skip_reason }}
        run: |
          python trusted/.github/scripts/render_summary.py \
            --results "$RUNNER_TEMP/results/results.json" \
            --guard "$RUNNER_TEMP/guard/guard.json" \
            --report "$RUNNER_TEMP/guard/report.json" \
            --review "$RUNNER_TEMP/review.json" \
            --sha "$HEAD_SHA" --commit "$COMMIT_SHA" \
            --skip-reason "$SKIP_REASON" \
            --out "$RUNNER_TEMP/summary.md" --step-summary
          python trusted/.github/scripts/publish.py comment --pr "$PR" --body "$RUNNER_TEMP/summary.md"

      - name: Create the terraform-test check run on the final commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha || github.event.pull_request.head.sha }}
          DETAILS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          guard_args=()
          if [ -f "$RUNNER_TEMP/guard/guard.json" ]; then guard_args=(--guard "$RUNNER_TEMP/guard/guard.json"); fi
          python trusted/.github/scripts/publish.py check --sha "$SHA" \
            --results "$RUNNER_TEMP/results/results.json" "${guard_args[@]}" \
            --summary "$RUNNER_TEMP/summary.md" --details-url "$DETAILS"
