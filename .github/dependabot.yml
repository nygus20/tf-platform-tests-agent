version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /.github/agent-runtime
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: weekly
